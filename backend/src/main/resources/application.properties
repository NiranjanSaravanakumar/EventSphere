# ==========================================
# EventSphere - Application Configuration
# ==========================================

# Server
server.port=8080

# ==========================================
# MySQL DataSource
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/eventsphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=3d3f4a8b9c1e2f5a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a
app.jwt.expiration-ms=86400000

# ==========================================
# Logging
# ==========================================
logging.level.com.eventsphere=INFO
logging.level.org.springframework.security=WARN
